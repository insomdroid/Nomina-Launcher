name: Nomina Release APK

# Build automatically whenever main changes, while keeping manual runs available.
on:
  push:
    branches:
      - main
    # Reference images and screenshots do not affect the APK.
    # A push containing source/config changes still triggers the build.
    paths-ignore:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.gif'
  workflow_dispatch:
    inputs:
      record_baseline_profile:
        description: "Record Nomina startup, App Drawer and Settings profiles before building the release APK"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nomina-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record-baseline-profile:
    name: Record Baseline Profile and build optimized APK
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.record_baseline_profile == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[record-baseline-profile]')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove one-shot recording trigger
        if: github.event_name == 'push'
        run: rm -f baselineprofile/RECORD_NOW

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Record Nomina Baseline Profile on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:generateBaselineProfile --stacktrace

      - name: Commit generated Baseline Profile
        shell: bash
        run: |
          set -euo pipefail
          git add -A app/src/main/generated/baselineProfiles/ baselineprofile/RECORD_NOW
          if git diff --cached --quiet; then
            echo "Baseline Profile is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "perf: add Nomina baseline profiles"
            git push origin HEAD:main
          fi

      - name: Create temporary release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/nomina-temporary-release.jks" \
            -storepass "nomina-temporary-pass" \
            -keypass "nomina-temporary-pass" \
            -alias "nomina-temporary" \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Nomina Temporary Release, OU=Interim, O=Nomina, L=Unknown, ST=Unknown, C=ID"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/nomina-temporary-release.jks
          storePassword=nomina-temporary-pass
          keyAlias=nomina-temporary
          keyPassword=nomina-temporary-pass
          EOF

      - name: Build optimized release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: nomina-release-apk-baseline-profile
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  release:
    if: (github.event_name != 'workflow_dispatch' || inputs.record_baseline_profile != true) && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[record-baseline-profile]'))
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew


      # Temporary signing key for this interim release only. It is deliberately not committed.
      # A future permanent release key must be stored as GitHub Actions secrets and reused.
      - name: Create temporary release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/nomina-temporary-release.jks" \
            -storepass "nomina-temporary-pass" \
            -keypass "nomina-temporary-pass" \
            -alias "nomina-temporary" \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Nomina Temporary Release, OU=Interim, O=Nomina, L=Unknown, ST=Unknown, C=ID"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/nomina-temporary-release.jks
          storePassword=nomina-temporary-pass
          keyAlias=nomina-temporary
          keyPassword=nomina-temporary-pass
          EOF

      - name: Build minified release APK
        shell: bash
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload signed release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nomina-release-apk-temporary-signing
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 7
