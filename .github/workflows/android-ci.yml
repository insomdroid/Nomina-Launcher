name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build APK and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect application and test changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          base: main
          filters: |
            app:
              - 'app/src/main/**'
              - 'app/build.gradle.kts'
              - 'app/proguard-rules.pro'
              - 'core/**/src/main/**'
              - 'core/**/build.gradle.kts'
              - 'feature/**/src/main/**'
              - 'feature/**/build.gradle.kts'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'build-logic/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
            tests:
              - '**/src/test/**'
              - '**/src/androidTest/**'

      - name: Set up JDK 21
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.tests == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.tests == 'true' || github.event_name == 'workflow_dispatch'
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.tests == 'true' || github.event_name == 'workflow_dispatch'
        run: chmod +x ./gradlew

      # Build and all JVM unit tests share one Gradle invocation, daemon, dependency resolution,
      # configuration cache and worker pool. This avoids configuring the same multi-module project
      # independently on two GitHub-hosted runners.
      - name: Build debug APK and run unit tests
        id: gradle
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.tests == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          APP_CHANGED: ${{ steps.changes.outputs.app }}
          TESTS_CHANGED: ${{ steps.changes.outputs.tests }}
          RUN_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          tasks=()

          if [[ "$APP_CHANGED" == "true" || "$RUN_ALL" == "true" ]]; then
            tasks+=(":app:assembleDebug")
          fi

          if [[ "$APP_CHANGED" == "true" || "$TESTS_CHANGED" == "true" || "$RUN_ALL" == "true" ]]; then
            tasks+=(
              ":app:testDebugUnitTest"
              ":core:data:testDebugUnitTest"
              ":core:model:testDebugUnitTest"
              ":core:ui:testDebugUnitTest"
              ":feature:appdrawer:testDebugUnitTest"
              ":feature:backup:testDebugUnitTest"
              ":feature:home:testDebugUnitTest"
              ":feature:settings:testDebugUnitTest"
            )
          fi

          if (( ${#tasks[@]} == 0 )); then
            echo "No application or test files changed; Gradle was not started."
            exit 0
          fi

          ./gradlew "${tasks[@]}" --stacktrace

      - name: Report APK size and largest packaged files
        if: always() && (steps.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          if [[ -f app/build/outputs/apk/debug/app-debug.apk ]]; then
            du -h app/build/outputs/apk/debug/app-debug.apk
            unzip -l app/build/outputs/apk/debug/app-debug.apk | sort -nr | head -n 25
          else
            echo "APK was not produced."
          fi

      - name: Upload debug APK
        if: always() && (steps.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: nomina-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 7
