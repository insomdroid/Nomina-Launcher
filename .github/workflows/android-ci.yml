name: Nomina Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nomina-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build signed release APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Temporary signing key for this interim release only. It is deliberately not committed.
      # A future permanent release key must be stored as GitHub Actions secrets and reused.
      - name: Create temporary release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/nomina-temporary-release.jks" \
            -storepass "nomina-temporary-pass" \
            -keypass "nomina-temporary-pass" \
            -alias "nomina-temporary" \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Nomina Temporary Release, OU=Interim, O=Nomina, L=Unknown, ST=Unknown, C=ID"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/nomina-temporary-release.jks
          storePassword=nomina-temporary-pass
          keyAlias=nomina-temporary
          keyPassword=nomina-temporary-pass
          EOF

      # Build the APK independently so a failing JVM test cannot prevent its upload.
      - name: Build minified release APK
        shell: bash
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Report release APK size and packaged files
        if: always()
        shell: bash
        run: |
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            du -h app/build/outputs/apk/release/app-release.apk
            unzip -l app/build/outputs/apk/release/app-release.apk | sort -nr | head -n 30
            echo "R8 mapping files:"
            find app/build/outputs/mapping/release -maxdepth 1 -type f -printf '%f %k KB\n' 2>/dev/null || true
          else
            echo "Release APK was not produced."
          fi

      - name: Upload signed release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nomina-release-apk-temporary-signing
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 7

      # Unit tests are source-only and run after the APK has already been uploaded.
      - name: Run JVM unit tests
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew \
            :app:testDebugUnitTest \
            :core:data:testDebugUnitTest \
            :core:model:testDebugUnitTest \
            :core:ui:testDebugUnitTest \
            :feature:appdrawer:testDebugUnitTest \
            :feature:backup:testDebugUnitTest \
            :feature:home:testDebugUnitTest \
            :feature:settings:testDebugUnitTest \
            --stacktrace
