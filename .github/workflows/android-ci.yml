name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Report APK size and largest packaged files
        run: |
          du -h app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | sort -nr | head -n 25

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nomina-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :core:data:testDebugUnitTest :core:model:testDebugUnitTest :core:ui:testDebugUnitTest :feature:appdrawer:testDebugUnitTest :feature:backup:testDebugUnitTest :feature:home:testDebugUnitTest :feature:settings:testDebugUnitTest --stacktrace
