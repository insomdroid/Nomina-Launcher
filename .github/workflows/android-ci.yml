name: Nomina Release APK

# Build automatically whenever main changes, while keeping manual runs available.
on:
  push:
    branches:
      - main
    # Reference images and screenshots do not affect the APK.
    # A push containing source/config changes still triggers the build.
    paths-ignore:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.gif'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nomina-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run data module unit tests
        run: ./gradlew :core:data:testDebugUnitTest --stacktrace

      # Temporary signing key for this interim release only. It is deliberately not committed.
      # A future permanent release key must be stored as GitHub Actions secrets and reused.
      - name: Create temporary release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/nomina-temporary-release.jks" \
            -storepass "nomina-temporary-pass" \
            -keypass "nomina-temporary-pass" \
            -alias "nomina-temporary" \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Nomina Temporary Release, OU=Interim, O=Nomina, L=Unknown, ST=Unknown, C=ID"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/nomina-temporary-release.jks
          storePassword=nomina-temporary-pass
          keyAlias=nomina-temporary
          keyPassword=nomina-temporary-pass
          EOF

      - name: Build minified release APK
        shell: bash
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload signed release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nomina-release-apk-temporary-signing
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 7
