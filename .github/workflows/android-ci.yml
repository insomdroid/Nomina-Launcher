name: Nomina Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.gif'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nomina-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate permanent release signing secrets
        shell: bash
        env:
          NOMINA_RELEASE_KEYSTORE_BASE64: ${{ secrets.NOMINA_RELEASE_KEYSTORE_BASE64 }}
          NOMINA_RELEASE_STORE_PASSWORD: ${{ secrets.NOMINA_RELEASE_STORE_PASSWORD }}
          NOMINA_RELEASE_KEY_ALIAS: ${{ secrets.NOMINA_RELEASE_KEY_ALIAS }}
          NOMINA_RELEASE_KEY_PASSWORD: ${{ secrets.NOMINA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in NOMINA_RELEASE_KEYSTORE_BASE64 NOMINA_RELEASE_STORE_PASSWORD NOMINA_RELEASE_KEY_ALIAS NOMINA_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$NOMINA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nomina-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/nomina-release.jks" -storepass "$NOMINA_RELEASE_STORE_PASSWORD" >/dev/null
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/nomina-release.jks"
            printf 'storePassword=%s\n' "$NOMINA_RELEASE_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$NOMINA_RELEASE_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$NOMINA_RELEASE_KEY_PASSWORD"
          } > keystore.properties

      - name: Build minified release APK
        shell: bash
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload signed release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nomina-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
