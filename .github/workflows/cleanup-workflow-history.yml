name: Clean Workflow History

on:
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: nomina-workflow-history-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep the latest three completed runs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Delete older workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );

            const completed = runs
              .filter(run => run.status === "completed")
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));

            // Keep two previous completed runs; this cleanup run becomes the third.
            const keep = completed.slice(0, 2);
            const remove = completed.slice(2);

            core.info(`Completed runs found: ${completed.length}`);
            core.info(`Runs retained before this run completes: ${keep.length}`);
            core.info(`Older runs to delete: ${remove.length}`);

            for (const run of remove) {
              await github.rest.actions.deleteWorkflowRun({
                owner,
                repo,
                run_id: run.id
              });
              core.info(`Deleted run #${run.run_number} (${run.id})`);
            }

            core.info("Cleanup finished.");
