name: Migrate Nomina Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-build:
    name: Migrate package and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Migrate ARK package to Nomina
        shell: bash
        run: |
          set -euo pipefail

          old_package="org.arkikeskus.launcher"
          new_package="com.insomdroid.nomina"

          mapfile -t files < <(
            git grep -Il -e "$old_package" -e "Theme.ArkikeskusLauncher" -e "ARK-launcher" -- . ':!LICENSE' ':!NOTICE' || true
          )

          for file in "${files[@]}"; do
            perl -0pi -e '
              s/org\.arkikeskus\.launcher/com.insomdroid.nomina/g;
              s/Theme\.ArkikeskusLauncher/Theme.Nomina/g;
              s/ARK-launcher/Nomina/g;
            ' "$file"
          done

          while IFS= read -r -d '' old_dir; do
            parent="${old_dir%/org/arkikeskus}"
            mkdir -p "$parent/com"
            git mv "$old_dir" "$parent/com/insomdroid"
          done < <(find . -type d -path '*/org/arkikeskus' -print0)

          old_schema="core/data/schemas/org.arkikeskus.launcher.data.local.LauncherDatabase"
          new_schema="core/data/schemas/com.insomdroid.nomina.data.local.LauncherDatabase"
          if [ -d "$old_schema" ]; then
            git mv "$old_schema" "$new_schema"
          fi

          if [ -f settings.gradle.kts ]; then
            sed -i 's/rootProject.name = "arkikeskus-launcher"/rootProject.name = "Nomina"/' settings.gradle.kts
          fi

          if git grep -n "$old_package" -- . ':!LICENSE' ':!NOTICE'; then
            echo "Old ARK package references remain outside preserved license notices." >&2
            exit 1
          fi

          if ! grep -q 'namespace = "com.insomdroid.nomina"' app/build.gradle.kts; then
            echo "Application namespace migration did not complete." >&2
            exit 1
          fi

          if ! grep -q 'applicationId = "com.insomdroid.nomina"' app/build.gradle.kts; then
            echo "Application ID migration did not complete." >&2
            exit 1
          fi

          echo "Package migration prepared successfully."

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Remove one-time migration workflow and commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/migrate-nomina-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes were produced." >&2
            exit 1
          fi
          git commit -m "refactor: migrate ARK package identity to Nomina"
          git push origin HEAD:main

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nomina-package-migration-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
